<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polytrack - Polygon Racing Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            background: linear-gradient(180deg, #87ceeb 0%, #e0f6ff 100%);
            border: 4px solid #333;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        #score {
            margin-bottom: 10px;
            color: #ffeb3b;
        }

        #lives {
            color: #ff6b6b;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            z-index: 20;
            display: none;
            min-width: 300px;
        }

        #gameOver h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ffeb3b;
        }

        #gameOver p {
            font-size: 24px;
            margin-bottom: 30px;
        }

        #gameOver button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #gameOver button:hover {
            background: #764ba2;
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div id="score">Score: 0</div>
            <div id="lives">Lives: ❤️❤️❤️</div>
        </div>
        <div id="gameOver">
            <h1>GAME OVER</h1>
            <p id="finalScore">Score: 0</p>
            <button onclick="location.reload()">Play Again</button>
        </div>
        <div id="instructions">
            Use ARROW KEYS or WASD to move • Collect stars ⭐ • Avoid obstacles 🚫
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 800;
        canvas.height = 600;

        // Game variables
        let score = 0;
        let lives = 3;
        let gameOverFlag = false;

        // Player object
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 80,
            size: 20,
            speed: 5,
            velocityX: 0,
            velocityY: 0,
            rotation: 0,
            sides: 5 // Pentagon
        };

        // Arrays for game objects
        let stars = [];
        let obstacles = [];
        let particles = [];

        // Keyboard input
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Draw polygon
        function drawPolygon(x, y, sides, size, rotation, fillColor, strokeColor) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const angle = (i / sides) * Math.PI * 2 - Math.PI / 2;
                const px = Math.cos(angle) * size;
                const py = Math.sin(angle) * size;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }

        // Draw player
        function drawPlayer() {
            drawPolygon(player.x, player.y, player.sides, player.size, player.rotation, '#ff6b6b', '#c92a2a');
        }

        // Create stars
        function createStar() {
            stars.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -20,
                size: 8,
                collected: false
            });
        }

        // Create obstacles
        function createObstacle() {
            obstacles.push({
                x: Math.random() * (canvas.width - 60) + 30,
                y: -30,
                width: 60,
                height: 30,
                speed: 2 + Math.random() * 2,
                sides: Math.floor(Math.random() * 3) + 3
            });
        }

        // Draw stars
        function drawStars() {
            stars.forEach((star, index) => {
                if (!star.collected) {
                    drawPolygon(star.x, star.y, 5, star.size, 0, '#ffeb3b', '#fbc02d');
                    star.y += 3;

                    // Check if star is off screen
                    if (star.y > canvas.height) {
                        stars.splice(index, 1);
                    }
                }
            });
        }

        // Draw obstacles
        function drawObstacles() {
            obstacles.forEach((obs, index) => {
                drawPolygon(obs.x, obs.y, obs.sides, 15, 0, '#8b4513', '#654321');
                obs.y += obs.speed;

                // Check if obstacle is off screen
                if (obs.y > canvas.height) {
                    obstacles.splice(index, 1);
                }
            });
        }

        // Draw particles
        function drawParticles() {
            particles.forEach((particle, index) => {
                ctx.fillStyle = particle.color;
                ctx.globalAlpha = particle.life / 100;
                ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
                ctx.globalAlpha = 1;

                particle.x += particle.velocityX;
                particle.y += particle.velocityY;
                particle.life--;

                if (particle.life <= 0) {
                    particles.splice(index, 1);
                }
            });
        }

        // Create particles
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    velocityX: (Math.random() - 0.5) * 4,
                    velocityY: (Math.random() - 0.5) * 4,
                    size: Math.random() * 5 + 2,
                    color: color,
                    life: 100
                });
            }
        }

        // Update player position
        function updatePlayer() {
            player.velocityX = 0;
            player.velocityY = 0;

            if (keys['arrowup'] || keys['w']) player.velocityY -= player.speed;
            if (keys['arrowdown'] || keys['s']) player.velocityY += player.speed;
            if (keys['arrowleft'] || keys['a']) player.velocityX -= player.speed;
            if (keys['arrowright'] || keys['d']) player.velocityX += player.speed;

            player.x += player.velocityX;
            player.y += player.velocityY;

            // Boundaries
            if (player.x < player.size) player.x = player.size;
            if (player.x > canvas.width - player.size) player.x = canvas.width - player.size;
            if (player.y < player.size) player.y = player.size;
            if (player.y > canvas.height - player.size) player.y = canvas.height - player.size;

            // Rotation
            if (player.velocityX !== 0 || player.velocityY !== 0) {
                player.rotation += 0.1;
            }
        }

        // Check collision
        function checkCollision(obj1, obj2) {
            const dx = obj1.x - obj2.x;
            const dy = obj1.y - obj2.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            return distance < obj1.size + obj2.size;
        }

        // Update game
        function update() {
            updatePlayer();

            // Spawn stars
            if (Math.random() < 0.02) {
                createStar();
            }

            // Spawn obstacles
            if (Math.random() < 0.01) {
                createObstacle();
            }

            // Check star collisions
            stars.forEach((star, index) => {
                if (checkCollision(player, star)) {
                    score += 10;
                    createParticles(star.x, star.y, '#ffeb3b', 10);
                    stars.splice(index, 1);
                }
            });

            // Check obstacle collisions
            obstacles.forEach((obs, index) => {
                if (checkCollision(player, obs)) {
                    lives--;
                    createParticles(player.x, player.y, '#ff6b6b', 15);
                    obstacles.splice(index, 1);

                    if (lives <= 0) {
                        gameOverFlag = true;
                    }
                }
            });

            // Update UI
            document.getElementById('score').textContent = `Score: ${score}`;
            document.getElementById('lives').textContent = `Lives: ${'❤️'.repeat(Math.max(0, lives))}`;
        }

        // Draw everything
        function draw() {
            // Clear canvas
            ctx.fillStyle = 'rgba(135, 206, 235, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw track/background grid
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw game objects
            drawStars();
            drawObstacles();
            drawParticles();
            drawPlayer();
        }

        // Game loop
        function gameLoop() {
            if (!gameOverFlag) {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            } else {
                document.getElementById('gameOver').style.display = 'block';
                document.getElementById('finalScore').textContent = `Final Score: ${score}`;
            }
        }

        // Start game
        gameLoop();
    </script>
</body>
</html>
